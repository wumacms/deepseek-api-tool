<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✅ Vue + Tailwind 待办</title>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js">
    </script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        /* 自定义复选框 */
        .task-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #cbd5e1;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .task-checkbox:checked {
            background-color: #22c55e;
            border-color: #22c55e;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            background-size: 0.8rem;
            background-position: center;
            background-repeat: no-repeat;
        }

        .task-checkbox:focus-visible {
            outline: 2px solid #22c55e;
            outline-offset: 2px;
        }

        /* 动画 */
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 滚动条 */
        .task-list::-webkit-scrollbar {
            width: 6px;
        }

        .task-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 8px;
        }

        .task-list::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* 删除按钮默认隐藏，hover 显示 */
        .task-item .delete-btn {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .task-item:hover .delete-btn,
        .task-item:focus-within .delete-btn {
            opacity: 1;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div id="app"
        class="w-full max-w-lg bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/60 p-6 sm:p-8 transition-all duration-300">

        <!-- 标题 + 统计 -->
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                <span class="text-3xl">📋</span> 待办
            </h1>
            <div class="text-sm text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full font-medium tabular-nums">
                {{ doneCount }} / {{ tasks.length }}
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="flex gap-2 mb-6">
            <input v-model.trim="newTaskText" @keydown.enter="addTask" type="text" placeholder="写一个任务..."
                autocomplete="off"
                class="flex-1 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/60 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400/50 focus:border-emerald-300 transition-all duration-200 text-sm"
                :class="{ 'border-rose-300 ring-2 ring-rose-200': showError }" ref="inputRef" />
            <button @click="addTask"
                class="px-5 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-medium rounded-xl shadow-md shadow-emerald-200/50 transition-all duration-150 flex items-center gap-1 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                添加
            </button>
        </div>

        <!-- 任务列表 -->
        <ul class="task-list space-y-2 max-h-[360px] overflow-y-auto pr-1">
            <li v-if="tasks.length === 0" class="text-center text-slate-400 py-8 text-sm">
                ✨ 还没有任务，添加一条吧
            </li>
            <li v-for="task in tasks" :key="task.id"
                class="task-item flex items-center gap-3 px-3 py-2.5 rounded-xl bg-white border border-slate-100 shadow-sm hover:shadow-md hover:border-slate-200 transition-all duration-150 fade-in">
                <!-- 复选框 -->
                <input type="checkbox" :checked="task.done" @change="toggleTask(task.id)" class="task-checkbox" />
                <!-- 任务文本 -->
                <span class="flex-1 text-sm font-medium transition-all duration-150"
                    :class="task.done ? 'text-slate-300 line-through' : 'text-slate-700'">
                    {{ task.text }}
                </span>
                <!-- 删除按钮 -->
                <button @click="deleteTask(task.id)"
                    class="delete-btn p-1.5 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-500 focus:outline-none focus:opacity-100 transition-opacity duration-150"
                    aria-label="删除任务">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19.5 6l-1.5 14.25A2.25 2.25 0 0115.75 22.5h-7.5a2.25 2.25 0 01-2.25-2.25L4.5 6m4.5 0V3.75A1.5 1.5 0 0110.5 2.25h3a1.5 1.5 0 011.5 1.5V6m-6 0h6" />
                    </svg>
                </button>
            </li>
        </ul>

        <!-- 底部操作栏 -->
        <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
            <span class="font-medium">{{ remainingCount }} 项未完成</span>
            <button @click="clearCompleted"
                class="px-3 py-1.5 rounded-lg hover:bg-rose-50 hover:text-rose-500 text-slate-400 transition-colors duration-150 font-medium">
                清除已完成
            </button>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

        const STORAGE_KEY = 'vue_todo_tailwind';

        const app = createApp({
            setup() {
                // --- 响应式状态 ---
                const tasks = ref([]);
                const newTaskText = ref('');
                const inputRef = ref(null);
                const showError = ref(false);

                // --- 计算属性 ---
                const doneCount = computed(() => tasks.value.filter(t => t.done).length);
                const remainingCount = computed(() => tasks.value.length - doneCount.value);

                // --- 本地存储操作 ---
                function loadTasks() {
                    try {
                        const stored = localStorage.getItem(STORAGE_KEY);
                        if (stored) {
                            const parsed = JSON.parse(stored);
                            if (Array.isArray(parsed)) {
                                // 确保每个任务有 id 和创建时间
                                tasks.value = parsed.map(t => ({
                                    ...t,
                                    id: t.id || 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                                    createdAt: t.createdAt || Date.now(),
                                }));
                                // 按创建时间排序
                                tasks.value.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                            }
                        }
                    } catch (e) {
                        console.warn('加载本地数据失败', e);
                    }
                }

                function saveTasks() {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks.value));
                    } catch (e) {
                        console.warn('保存本地数据失败', e);
                    }
                }

                // 监听 tasks 变化，自动保存
                watch(tasks, saveTasks, { deep: true });

                // --- 操作方法 ---
                function addTask() {
                    const text = newTaskText.value;
                    if (!text) {
                        showError.value = true;
                        setTimeout(() => { showError.value = false; }, 600);
                        inputRef.value?.focus();
                        return;
                    }

                    const newTask = {
                        id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                        text: text,
                        done: false,
                        createdAt: Date.now(),
                    };
                    tasks.value.push(newTask);
                    newTaskText.value = '';
                    inputRef.value?.focus();

                    // 滚动到新任务
                    nextTick(() => {
                        const list = document.querySelector('.task-list');
                        if (list) list.scrollTop = list.scrollHeight;
                    });
                }

                function toggleTask(id) {
                    const task = tasks.value.find(t => t.id === id);
                    if (task) {
                        task.done = !task.done;
                    }
                }

                function deleteTask(id) {
                    tasks.value = tasks.value.filter(t => t.id !== id);
                }

                function clearCompleted() {
                    const hasCompleted = tasks.value.some(t => t.done);
                    if (!hasCompleted) return;
                    tasks.value = tasks.value.filter(t => !t.done);
                }

                // --- 键盘全局监听：快速聚焦输入框 ---
                function handleGlobalKeydown(e) {
                    // 如果按下的是可输入字符，且焦点不在输入框或列表内，自动聚焦
                    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        const active = document.activeElement;
                        const list = document.querySelector('.task-list');
                        if (active !== inputRef.value && !list?.contains(active)) {
                            inputRef.value?.focus();
                        }
                    }
                }

                // --- 生命周期 ---
                onMounted(() => {
                    loadTasks();
                    document.addEventListener('keydown', handleGlobalKeydown);
                });

                // 返回模板中需要的变量和方法
                return {
                    tasks,
                    newTaskText,
                    inputRef,
                    showError,
                    doneCount,
                    remainingCount,
                    addTask,
                    toggleTask,
                    deleteTask,
                    clearCompleted,
                };
            }
        });

        app.mount('#app');
    </script>

</body>

</html>
